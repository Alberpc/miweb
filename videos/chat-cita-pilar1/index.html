<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=480" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 800px; height: 480px; overflow: hidden;
        background: #FFFFFF; /* mas claro que el panel: asi se despega */
      }
      body { font-family: "Geist", system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4.6"
      data-width="800"
      data-height="480"
      style="position: relative; width: 800px; height: 480px; background: #FFFFFF; overflow: hidden;"
    >
      <div
        id="scene"
        class="clip"
        data-start="0"
        data-duration="4.6"
        data-track-index="0"
        style="position: absolute; inset: 0;"
      >
        <div class="bg-field"></div>

        <!-- Tres activadores entran por la izquierda, el agente atiende en el
             centro, y la salida es doble: ficha en el CRM y respuesta al
             cliente. El agente es el protagonista, no la herramienta. -->
        <svg id="rail-svg" width="800" height="480" viewBox="0 0 800 480" style="position: absolute; inset: 0; z-index: 1;">
          <defs>
            <linearGradient id="gIn" gradientUnits="userSpaceOnUse" x1="160" y1="0" x2="330" y2="0">
              <stop offset="0%" stop-color="#B44100" stop-opacity="0.34" />
              <stop offset="100%" stop-color="#B44100" stop-opacity="0.5" />
            </linearGradient>
            <linearGradient id="gOut" gradientUnits="userSpaceOnUse" x1="470" y1="0" x2="620" y2="0">
              <stop offset="0%" stop-color="#B44100" stop-opacity="0.5" />
              <stop offset="100%" stop-color="#B44100" stop-opacity="0.12" />
            </linearGradient>
          </defs>
          <!-- entradas: los tres canales convergen en el agente -->
          <path id="in-1" d="M 172 116 H 240 V 240" fill="none" stroke="url(#gIn)" stroke-width="2" stroke-linejoin="round" />
          <path id="in-2" d="M 172 240 H 240" fill="none" stroke="url(#gIn)" stroke-width="2" />
          <path id="in-3" d="M 172 364 H 240 V 240" fill="none" stroke="url(#gIn)" stroke-width="2" stroke-linejoin="round" />
          <path id="in-join" d="M 240 240 H 322" fill="none" stroke="url(#gIn)" stroke-width="2" />
          <circle id="in-node" cx="240" cy="240" r="4" fill="#B44100" opacity="0" />

          <!-- salidas -->
          <path id="out-1" d="M 478 226 H 546 V 152 H 604" fill="none" stroke="url(#gOut)" stroke-width="2" stroke-linejoin="round" />
          <path id="out-2" d="M 478 254 H 546 V 326 H 604" fill="none" stroke="url(#gOut)" stroke-width="2" stroke-linejoin="round" />
        </svg>

        <!-- ACTIVADORES: por donde entra un cliente -->
        <div id="trg-1" class="trg">
          <div class="trg-box">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="#25D366" aria-label="WhatsApp">
              <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.724-1.457L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436.002 9.858-4.417 9.86-9.86.001-2.638-1.024-5.117-2.884-6.979C16.578 1.904 14.1 1.84 12.01 1.84c-5.439 0-9.862 4.419-9.865 9.866-.001 1.8.49 3.554 1.42 5.11L2.551 21.39l4.096-1.076zM17.486 14.4c-.269-.137-1.593-.787-1.839-.877-.246-.09-.425-.137-.604.137-.179.273-.694.877-.85 1.057-.156.18-.313.202-.582.066-.268-.137-1.136-.419-2.162-1.335-.797-.711-1.336-1.59-1.493-1.864-.157-.273-.017-.42.12-.556.124-.121.269-.313.403-.47.135-.157.179-.269.269-.45.09-.18.045-.338-.021-.472-.069-.137-.604-1.46-.828-2.002-.218-.524-.458-.453-.627-.453-.162 0-.348-.02-.534-.02-.187 0-.49.07-.748.35-.258.28-1.008.986-1.008 2.404 0 1.417 1.031 2.787 1.176 2.977.145.19 2.03 3.1 4.916 4.344.686.296 1.222.473 1.639.605.69.219 1.319.189 1.815.115.553-.083 1.593-.652 1.818-1.284.224-.633.224-1.176.157-1.285-.067-.109-.246-.145-.515-.282z"/>
            </svg>
          </div>
          <span class="trg-label">WhatsApp</span>
        </div>

        <div id="trg-2" class="trg">
          <div class="trg-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="#EA8258" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="26" height="26" aria-label="Tu web">
              <rect x="2.5" y="4" width="19" height="16" rx="2.5"/>
              <path d="M2.5 8.5h19"/>
              <circle cx="5.6" cy="6.2" r="0.7" fill="#EA8258" stroke="none"/>
              <circle cx="8" cy="6.2" r="0.7" fill="#EA8258" stroke="none"/>
            </svg>
          </div>
          <span class="trg-label">Tu web</span>
        </div>

        <div id="trg-3" class="trg">
          <div class="trg-box">
            <svg viewBox="0 0 24 24" width="26" height="26" aria-label="Instagram">
              <defs>
                <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#FEDA75"/><stop offset="25%" stop-color="#FA7E1E"/>
                  <stop offset="50%" stop-color="#D62976"/><stop offset="75%" stop-color="#962FBF"/>
                  <stop offset="100%" stop-color="#4F5BD5"/>
                </linearGradient>
              </defs>
              <rect x="2.5" y="2.5" width="19" height="19" rx="5.4" fill="none" stroke="url(#igGrad)" stroke-width="2"/>
              <circle cx="12" cy="12" r="4.2" fill="none" stroke="url(#igGrad)" stroke-width="2"/>
              <circle cx="17.4" cy="6.6" r="1.3" fill="#D62976"/>
            </svg>
          </div>
          <span class="trg-label">Instagram</span>
        </div>

        <!-- EL AGENTE: atiende y decide. Es el protagonista del pilar. -->
        <div id="agente">
          <div id="agente-ring"></div>
          <div id="agente-box">
            <div class="ag-avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="#121316" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" width="19" height="19" aria-label="Agente de IA">
                <rect x="4" y="7.5" width="16" height="12" rx="3.5"/>
                <path d="M12 7.5V4M9 2.6h6"/>
                <circle cx="9" cy="13" r="1.3" fill="#121316" stroke="none"/>
                <circle cx="15" cy="13" r="1.3" fill="#121316" stroke="none"/>
                <path d="M1.6 12v3M22.4 12v3"/>
              </svg>
              <span class="ag-live"></span>
            </div>
            <div class="ag-dots">
              <span class="ag-dot"></span><span class="ag-dot"></span><span class="ag-dot"></span>
            </div>
            <div class="ag-bubble" id="ag-bubble">Te agendo el martes a las 11:00</div>
          </div>
          <span class="ag-label">El agente atiende y resuelve</span>
        </div>

        <!-- SALIDA 1: la ficha queda en el CRM -->
        <div id="out-crm" class="dest">
          <div class="crm-card">
            <div class="crm-row">
              <span class="crm-avatar">MR</span>
              <span class="crm-lines">
                <span class="crm-line"></span>
                <span class="crm-line short"></span>
              </span>
            </div>
            <div class="crm-tag">Cita · martes 11:00</div>
          </div>
          <span class="dest-label">Ficha creada en tu CRM</span>
        </div>

        <!-- SALIDA 2: el cliente recibe respuesta -->
        <div id="out-reply" class="dest">
          <div class="reply-box">
            <span class="reply-bubble">Confirmado</span>
            <span class="reply-check">
              <svg viewBox="0 0 24 24" fill="none" stroke="#B44100" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="13" height="13">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </span>
          </div>
          <span class="dest-label">Cliente respondido</span>
        </div>
      </div>
    </div>

    <style>
      .bg-field {
        position: absolute; inset: 0; z-index: 0;
        /* [1-sep-2026] Sin resplandor: sobre papel el halo terracota al 9%
           daba un beige (#F8EEE8) que se separaba del blanco 1.142 — mas
           que el propio video del panel gris. En la escena verde oscura si
           aportaba profundidad; aqui solo ensuciaba. La profundidad la dan
           ya las sombras de las tarjetas. */
      }

      .trg {
        position: absolute; left: 138px;
        display: flex; flex-direction: column; align-items: center;
        z-index: 4; opacity: 0;
      }
      #trg-1 { top: 116px; }
      #trg-2 { top: 240px; }
      #trg-3 { top: 364px; }
      .trg-box {
        width: 60px; height: 60px; border-radius: 17px;
        background: linear-gradient(160deg, rgba(18, 19, 22, 0.05), rgba(18, 19, 22, 0.02));
        border: 1px solid rgba(180, 65, 0, 0.22);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
        display: flex; align-items: center; justify-content: center;
      }
      .trg-label {
        margin-top: 9px; font-size: 15px; font-weight: 500;
        color: rgba(85, 88, 95, 0.92); white-space: nowrap;
      }

      #agente {
        position: absolute; left: 400px; top: 240px;
        display: flex; flex-direction: column; align-items: center;
        z-index: 3; opacity: 0;
      }
      /* El avatar sale por arriba de la caja, como una ficha de contacto:
         asi se ve QUIEN atiende y no solo que algo pasa. */
      .ag-avatar {
        position: absolute; top: -19px; left: 50%;
        margin-left: -19px;
        width: 38px; height: 38px; border-radius: 50%;
        background: linear-gradient(160deg, #EA8258, #B44100);
        border: 2.5px solid #121316;
        display: flex; align-items: center; justify-content: center;
      }
      .ag-live {
        position: absolute; right: 0; bottom: 1px;
        width: 10px; height: 10px; border-radius: 50%;
        background: #3DDC84;
        border: 2px solid #121316;
      }

      #agente-box {
        position: relative;
        width: 184px; height: 118px; border-radius: 22px;
        background: linear-gradient(165deg, #FFFFFF, #F4F4F6);
        border: 1.5px solid rgba(180, 65, 0, 0.45);
        box-shadow: 0 16px 40px -14px rgba(18, 19, 22, 0.30), inset 0 1px 0 #FFFFFF;
        display: flex; align-items: center; justify-content: center;
        padding: 12px;
      }
      #agente-ring {
        position: absolute; top: -8px; left: 50%;
        margin-left: -100px;
        width: 200px; height: 134px; border-radius: 26px;
        border: 1.5px solid rgba(180, 65, 0, 0.75);
        opacity: 0;
      }
      /* Los tres puntos: el agente "pensando" antes de contestar. */
      .ag-dots { display: flex; gap: 7px; }
      .ag-dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: #EA8258;
      }
      .ag-bubble {
        position: absolute;
        top: 52%;
        font-size: 15.5px; font-weight: 500; line-height: 1.35;
        color: #121316; text-align: center;
        padding: 0 14px;
        opacity: 0;
      }
      .ag-label {
        margin-top: 13px; font-size: 16px; font-weight: 600;
        color: rgba(234, 130, 88, 0.95); white-space: nowrap;
      }

      .dest {
        position: absolute; left: 664px;
        display: flex; flex-direction: column; align-items: center;
        z-index: 4; opacity: 0;
      }
      #out-crm { top: 152px; }
      #out-reply { top: 326px; }

      /* La ficha del CRM: generica a proposito, para que valga sea cual sea
         el CRM del cliente. */
      .crm-card {
        width: 132px; border-radius: 12px;
        background: linear-gradient(165deg, #FFFFFF, #EFEFF1);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.14);
        padding: 11px 12px;
        display: flex; flex-direction: column; gap: 9px;
      }
      .crm-row { display: flex; align-items: center; gap: 9px; }
      .crm-avatar {
        width: 26px; height: 26px; border-radius: 50%;
        background: #B44100; color: #FFFFFF;
        font-size: 12px; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      .crm-lines { display: flex; flex-direction: column; gap: 5px; flex: 1; }
      .crm-line { height: 5px; border-radius: 3px; background: rgba(18, 19, 22, 0.30); }
      .crm-line.short { width: 58%; }
      .crm-tag {
        font-size: 12.5px; font-weight: 700;
        color: #7A2C00;
        background: rgba(180, 65, 0, 0.22);
        border-radius: 5px; padding: 4px 7px;
        text-align: center;
      }

      .reply-box {
        position: relative;
        display: flex; align-items: center; justify-content: center;
      }
      .reply-bubble {
        font-size: 15px; font-weight: 600; color: #121316;
        background: #25D366;
        border-radius: 12px 12px 12px 3px;
        padding: 9px 14px;
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.14);
      }
      .reply-check {
        position: absolute; right: -9px; bottom: -9px;
        width: 22px; height: 22px; border-radius: 50%;
        background: #121316; border: 1.5px solid rgba(180, 65, 0, 0.55);
        display: flex; align-items: center; justify-content: center;
        opacity: 0;
      }

      .dest-label {
        margin-top: 11px; font-size: 15px; font-weight: 500;
        color: rgba(85, 88, 95, 0.92); white-space: nowrap;
      }
    </style>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const trgs = ["#trg-1", "#trg-2", "#trg-3"];
        const ins = ["#in-1", "#in-2", "#in-3"];
        const inJoin = "#in-join";
        const outs = ["#out-1", "#out-2"];

        gsap.set(trgs, { xPercent: -50, yPercent: -50, opacity: 0, scale: 0.85 });
        gsap.set("#agente", { xPercent: -50, yPercent: -50, opacity: 0, scale: 0.85 });
        gsap.set(["#out-crm", "#out-reply"], { xPercent: -50, yPercent: -50, opacity: 0, scale: 0.9 });
        // Cada tramo con SU longitud: un dasharray fijo deja los cortos sin
        // dibujar (el trazo cabe entero en el hueco).
        const allPaths = [...ins, inJoin, ...outs];
        const pathLen = {};
        allPaths.forEach((sel) => {
          const el = document.querySelector(sel);
          const L = Math.ceil(el.getTotalLength());
          pathLen[sel] = L;
          gsap.set(el, { strokeDasharray: L, strokeDashoffset: L });
        });
        gsap.set(".ag-bubble", { opacity: 0 });
        gsap.set(".reply-check", { opacity: 0, scale: 0.4 });

        // 1. Los tres canales por los que entra un cliente.
        tl.to(trgs, { xPercent: -50, yPercent: -50, opacity: 1, scale: 1, duration: 0.42, stagger: 0.12, ease: "back.out(1.6)" }, 0);

        // 2. Se conectan al agente, que aparece atendiendo.
        tl.to(ins, { strokeDashoffset: 0, duration: 0.5, stagger: 0.07, ease: "power2.out" }, 0.45);
        tl.to("#in-node", { opacity: 1, duration: 0.25 }, 0.72);
        tl.to("#in-join", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.78);
        tl.to("#agente", { xPercent: -50, yPercent: -50, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 0.6);

        // 3. Piensa: los puntos laten mientras procesa la consulta.
        tl.to(".ag-dot", { opacity: 0.35, duration: 0.28, stagger: { each: 0.12, repeat: 3, yoyo: true }, ease: "power1.inOut" }, 1.15);

        // 4. Resuelve: los puntos dan paso a la respuesta concreta.
        tl.to(".ag-dots", { opacity: 0, duration: 0.2 }, 2.1);
        tl.to(".ag-bubble", { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.2);
        tl.to("#agente-ring", { opacity: 0.85, scale: 1.06, duration: 0.34, ease: "power2.out" }, 2.15);
        tl.to("#agente-ring", { opacity: 0, duration: 0.3 }, 2.5);
        tl.set("#agente-ring", { scale: 1 }, 2.82);

        // 5. Y el trabajo sale por los dos lados: CRM y cliente.
        tl.to(outs, { strokeDashoffset: 0, duration: 0.45, stagger: 0.08, ease: "power2.out" }, 2.45);
        tl.to("#out-crm", { xPercent: -50, yPercent: -50, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 2.7);
        tl.to("#out-reply", { xPercent: -50, yPercent: -50, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 2.85);
        tl.to(".reply-check", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 3.2);

        tl.addLabel("hold", 3.8);

        // 6. Fundido para el bucle.
        tl.to([...trgs, "#agente", "#out-crm", "#out-reply"], { opacity: 0, duration: 0.4, ease: "power1.in" }, "hold");
        tl.to([...ins, inJoin, ...outs, "#in-node"], { opacity: 0, duration: 0.4 }, "hold");
        allPaths.forEach((sel) => {
          tl.set(sel, { strokeDashoffset: pathLen[sel], opacity: 1 }, "hold+=0.4");
        });
        tl.set("#in-node", { opacity: 0 }, "hold+=0.4");
        tl.set(".ag-dots", { opacity: 1 }, "hold+=0.4");
        tl.set(".ag-dot", { opacity: 1 }, "hold+=0.4");
        tl.set(".ag-bubble", { opacity: 0 }, "hold+=0.4");
        tl.set(".reply-check", { opacity: 0, scale: 0.4 }, "hold+=0.4");

        tl.addLabel("loopEnd", "hold+=0.6");

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
