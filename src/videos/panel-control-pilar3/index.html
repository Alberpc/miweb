<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=480" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 800px; height: 480px; overflow: hidden;
        background: #0f1f1b; /* --night-900 */
      }
      body { font-family: "Inter", sans-serif; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4.2"
      data-width="800"
      data-height="480"
      style="position: relative; width: 800px; height: 480px; background: #0f1f1b; overflow: hidden;"
    >
      <div
        id="scene"
        class="clip"
        data-start="0"
        data-duration="4.2"
        data-track-index="0"
        style="position: absolute; inset: 0;"
      >
        <div class="bg-field"></div>

        <!-- Ya no hay nodos ni cables: esto es un panel de control, asi que lo
             que se ve es el panel entero ocupando la escena. -->
        <div id="panel">
          <div class="panel-head">
            <span class="panel-title">Resumen del mes</span>
            <span class="panel-live"><span class="live-dot"></span>En directo</span>
          </div>

          <!-- Fila de KPIs: los numeros que de verdad mira un dueño. -->
          <div class="kpis">
            <div class="kpi">
              <span class="kpi-cap">Llamadas</span>
              <span class="kpi-num" id="k1">0</span>
              <span class="kpi-delta up">+12%</span>
            </div>
            <div class="kpi">
              <span class="kpi-cap">Cierres</span>
              <span class="kpi-num" id="k2">0</span>
              <span class="kpi-delta up">+8%</span>
            </div>
            <div class="kpi">
              <span class="kpi-cap">Inversión</span>
              <span class="kpi-num" id="k3">0</span>
              <span class="kpi-delta down">-5%</span>
            </div>
            <div class="kpi">
              <span class="kpi-cap">Facturado</span>
              <span class="kpi-num" id="k4">0</span>
              <span class="kpi-delta up">+21%</span>
            </div>
          </div>

          <!-- Grafica de barras con eje: lectura de contabilidad, no adorno. -->
          <div class="chart">
            <div class="chart-head">
              <span class="chart-title">Facturación por semana</span>
              <span class="chart-legend"><span class="lg-swatch"></span>2026</span>
            </div>
            <div class="chart-body">
              <div class="grid-lines">
                <span></span><span></span><span></span><span></span>
              </div>
              <div class="bars">
                <div class="bar-col"><span class="bar" data-h="46"></span><span class="bar-lab">S1</span></div>
                <div class="bar-col"><span class="bar" data-h="62"></span><span class="bar-lab">S2</span></div>
                <div class="bar-col"><span class="bar" data-h="54"></span><span class="bar-lab">S3</span></div>
                <div class="bar-col"><span class="bar" data-h="78"></span><span class="bar-lab">S4</span></div>
                <div class="bar-col"><span class="bar" data-h="92"></span><span class="bar-lab">S5</span></div>
              </div>
            </div>
          </div>

          <!-- Lista de movimientos: lo que hace que parezca un panel de verdad
               y no una infografia. -->
          <div class="rows">
            <div class="row">
              <span class="row-dot ok"></span>
              <span class="row-txt">Cierre · Reforma cocina</span>
              <span class="row-amt">3.480 €</span>
            </div>
            <div class="row">
              <span class="row-dot ok"></span>
              <span class="row-txt">Cierre · Mantenimiento anual</span>
              <span class="row-amt">1.150 €</span>
            </div>
            <div class="row">
              <span class="row-dot pend"></span>
              <span class="row-txt">Presupuesto enviado</span>
              <span class="row-amt">2.900 €</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <style>
      .bg-field {
        position: absolute; inset: 0; z-index: 0;
        background: radial-gradient(ellipse 620px 380px at 50% 46%, rgba(200, 168, 94, 0.08), transparent 72%);
      }

      #panel {
        position: absolute; left: 400px; top: 240px;
        width: 664px; height: 396px;
        border-radius: 20px;
        background: linear-gradient(168deg, rgba(39, 76, 59, 0.62), rgba(15, 31, 27, 0.86));
        border: 1px solid rgba(200, 168, 94, 0.26);
        box-shadow: 0 28px 64px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.07);
        padding: 20px 24px;
        display: flex; flex-direction: column; gap: 16px;
        opacity: 0;
      }

      .panel-head {
        display: flex; align-items: center; justify-content: space-between;
        padding-bottom: 14px;
        border-bottom: 1px solid rgba(200, 168, 94, 0.16);
      }
      .panel-title {
        font-size: 19px; font-weight: 600; color: #F3F5F2;
        letter-spacing: 0.01em;
      }
      .panel-live {
        display: flex; align-items: center; gap: 7px;
        font-size: 13px; font-weight: 600; letter-spacing: 0.09em;
        text-transform: uppercase; color: #C7CDC5;
      }
      .live-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: #3DDC84;
      }

      /* Sin cajas: los KPIs se separan con una linea vertical, que es como se
         hace en un panel real y evita 4 tarjetas iguales. */
      .kpis { display: flex; }
      .kpi {
        flex: 1;
        display: flex; flex-direction: column; gap: 5px;
        padding-left: 18px;
        border-left: 1px solid rgba(200, 168, 94, 0.14);
        opacity: 0;
      }
      .kpi:first-child { padding-left: 0; border-left: none; }
      .kpi-cap {
        font-size: 13px; font-weight: 600; letter-spacing: 0.1em;
        text-transform: uppercase; color: #C7CDC5;
      }
      .kpi-num {
        font-size: 38px; font-weight: 700; line-height: 1;
        color: #F3F5F2; font-variant-numeric: tabular-nums;
      }
      .kpi-delta {
        font-size: 14px; font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .kpi-delta.up { color: #3DDC84; }
      .kpi-delta.down { color: #F5A524; }

      .chart { flex: 1; display: flex; flex-direction: column; gap: 10px; }
      .chart-head {
        display: flex; align-items: center; justify-content: space-between;
      }
      .chart-title { font-size: 15px; font-weight: 600; color: #C7CDC5; }
      .chart-legend {
        display: flex; align-items: center; gap: 6px;
        font-size: 14px; color: #C7CDC5;
        font-variant-numeric: tabular-nums;
      }
      .lg-swatch {
        width: 10px; height: 10px; border-radius: 2px;
        background: #C8A85E;
      }
      .chart-body { position: relative; flex: 1; }
      .grid-lines {
        position: absolute; inset: 0 0 18px 0;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .grid-lines span {
        display: block; height: 1px;
        background: rgba(200, 168, 94, 0.10);
      }
      .bars {
        position: absolute; inset: 0;
        display: flex; align-items: flex-end; gap: 26px;
        padding: 0 4px;
      }
      .bar-col {
        flex: 1;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        height: 100%;
        justify-content: flex-end;
      }
      .bar {
        width: 100%; height: 0;
        border-radius: 4px 4px 0 0;
        background: linear-gradient(180deg, #C8A85E, rgba(200, 168, 94, 0.45));
      }
      .bar-lab {
        font-size: 13px; color: #C7CDC5;
        font-variant-numeric: tabular-nums;
      }

      .rows { display: flex; flex-direction: column; }
      .row {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 0;
        border-top: 1px solid rgba(200, 168, 94, 0.12);
        opacity: 0;
      }
      .row-dot {
        width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      }
      .row-dot.ok { background: #3DDC84; }
      .row-dot.pend { background: #F5A524; }
      .row-txt {
        flex: 1; font-size: 14.5px; color: #E6E1D7;
      }
      .row-amt {
        font-size: 14.5px; font-weight: 700; color: #D6BA82;
        font-variant-numeric: tabular-nums;
      }
    </style>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        gsap.set("#panel", { xPercent: -50, yPercent: -50, opacity: 0, scale: 0.96 });
        gsap.set(".kpi", { opacity: 0, y: 10 });
        gsap.set(".row", { opacity: 0, x: -8 });

        // 1. Entra el panel entero.
        tl.to("#panel", { xPercent: -50, yPercent: -50, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0);

        // 2. Los KPIs aparecen en cascada y sus numeros cuentan hasta su valor.
        tl.to(".kpi", { opacity: 1, y: 0, duration: 0.35, stagger: 0.08, ease: "power2.out" }, 0.3);

        const kpis = [
          { sel: "#k1", to: 142, suf: "" },
          { sel: "#k2", to: 38,  suf: "" },
          { sel: "#k3", to: 2.4, suf: "k €", dec: 1 },
          { sel: "#k4", to: 18.6, suf: "k €", dec: 1 },
        ];
        kpis.forEach((k, i) => {
          const o = { v: 0 };
          tl.to(o, {
            v: k.to, duration: 0.75, ease: "power2.out",
            onUpdate() {
              const el = document.querySelector(k.sel);
              const n = k.dec ? o.v.toFixed(k.dec).replace(".", ",") : Math.round(o.v);
              el.textContent = n + (k.suf || "");
            },
          }, 0.42 + i * 0.08);
        });

        // 3. Las barras crecen desde la base, como se lee un grafico real.
        document.querySelectorAll(".bar").forEach((el, i) => {
          tl.to(el, { height: el.dataset.h + "%", duration: 0.55, ease: "power3.out" }, 0.85 + i * 0.09);
        });

        // 4. Los movimientos entran por debajo.
        tl.to(".row", { opacity: 1, x: 0, duration: 0.35, stagger: 0.11, ease: "power2.out" }, 1.5);

        // 5. El punto de "en directo" late: el panel esta vivo.
        tl.to(".live-dot", { opacity: 0.25, duration: 0.5, repeat: 3, yoyo: true, ease: "power1.inOut" }, 1.0);

        tl.addLabel("hold", 3.4);

        // 6. Fundido para el bucle.
        tl.to("#panel", { opacity: 0, duration: 0.42, ease: "power1.in" }, "hold");
        tl.set(".kpi", { opacity: 0, y: 10 }, "hold+=0.42");
        tl.set(".row", { opacity: 0, x: -8 }, "hold+=0.42");
        tl.set(".bar", { height: 0 }, "hold+=0.42");
        tl.set(".live-dot", { opacity: 1 }, "hold+=0.42");

        tl.addLabel("loopEnd", "hold+=0.62");

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
