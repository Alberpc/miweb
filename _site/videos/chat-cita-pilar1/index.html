<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=480" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 800px;
        height: 480px;
        overflow: hidden;
        background: #070708;
      }
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4.05"
      data-width="800"
      data-height="480"
      style="position: relative; width: 800px; height: 480px; background: #070708; overflow: hidden;"
    >
      <div
        id="scene"
        class="clip"
        data-start="0"
        data-duration="4.05"
        data-track-index="0"
        style="position: absolute; inset: 0;"
      >
        <div class="bg-field"></div>

        <!-- CHAT PANEL (left) -->
        <div id="chat-panel">
          <div class="panel-sheen" id="chat-sheen"></div>
          <div class="chat-header">
            <span class="chat-dot"></span>
            <span class="chat-label">WhatsApp</span>
          </div>
          <div class="chat-body">
            <div class="bubble bubble-in" id="bubble-in">¿Tenéis cita para mañana?</div>
            <div class="typing-row" id="typing-row">
              <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
            </div>
            <div class="bubble bubble-out" id="bubble-out">¡Sí! Te agendo a las 11:00h.</div>
          </div>
        </div>

        <!-- ARROW / CONNECTOR between panels -->
        <svg id="connector-svg" width="800" height="480" viewBox="0 0 800 480" style="position: absolute; inset: 0; z-index: 1; pointer-events: none;">
          <defs>
            <linearGradient id="connGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#5275ff" />
              <stop offset="100%" stop-color="#aebbff" />
            </linearGradient>
          </defs>
          <path id="connector-path" d="M 372 300 Q 430 300 460 240" fill="none" stroke="url(#connGrad)" stroke-width="2.5" stroke-linecap="round" />
        </svg>

        <!-- Traveling card: the appointment, flying from chat to calendar -->
        <div id="fly-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="#dbe1ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span>11:00</span>
        </div>

        <!-- CALENDAR PANEL (right) -->
        <div id="cal-panel">
          <div class="panel-sheen" id="cal-sheen"></div>
          <div class="cal-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="#aebbff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span class="cal-label">Agenda</span>
          </div>
          <div class="cal-grid">
            <div class="cal-cell"></div>
            <div class="cal-cell"></div>
            <div class="cal-cell cal-slot" id="cal-slot">
              <span id="cal-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="#0a0c14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="13" height="13">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
            </div>
            <div class="cal-cell"></div>
            <div class="cal-cell"></div>
            <div class="cal-cell"></div>
          </div>
        </div>
      </div>
    </div>

    <style>
      .bg-field {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: radial-gradient(ellipse 500px 320px at 50% 50%, rgba(59, 94, 255, 0.08), transparent 70%);
      }

      #chat-panel,
      #cal-panel {
        position: absolute;
        top: 50%;
        border-radius: 26px;
        background: linear-gradient(165deg, rgba(32, 36, 58, 0.55), rgba(16, 18, 30, 0.48));
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1.5px solid rgba(174, 187, 255, 0.20);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        overflow: hidden;
        z-index: 2;
      }
      .panel-sheen {
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.08), transparent);
        opacity: 0;
        will-change: transform, opacity;
      }

      #chat-panel {
        left: 250px;
        width: 300px;
        height: 340px;
        transform-origin: center;
        opacity: 0;
      }
      .chat-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 18px 20px 0;
      }
      .chat-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #5edc8f;
        box-shadow: 0 0 6px 1px rgba(94, 220, 143, 0.6);
      }
      .chat-label {
        font-size: 13px;
        font-weight: 500;
        color: rgba(210, 216, 255, 0.65);
      }
      .chat-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .bubble {
        max-width: 82%;
        padding: 11px 15px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.35;
        opacity: 0;
        transform: scale(0);
        transform-origin: bottom left;
      }
      .bubble-in {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.06);
        color: rgba(225, 228, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-bottom-left-radius: 4px;
        transform-origin: bottom left;
      }
      .bubble-out {
        align-self: flex-end;
        background: linear-gradient(135deg, #3f5fe0, #2946c4);
        color: #ffffff;
        font-weight: 600;
        border-bottom-right-radius: 4px;
        transform-origin: bottom right;
      }
      .typing-row {
        align-self: flex-start;
        display: flex;
        gap: 4px;
        padding: 12px 16px;
        border-radius: 16px;
        border-bottom-left-radius: 4px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.06);
        opacity: 0;
        width: fit-content;
      }
      .typing-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(210, 216, 255, 0.6);
      }

      #connector-path {
        stroke-dasharray: 120;
        stroke-dashoffset: 120;
      }

      #fly-card {
        position: absolute;
        left: 400px;
        top: 270px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 14px;
        background: linear-gradient(135deg, rgba(82, 117, 255, 0.9), rgba(59, 94, 255, 0.9));
        box-shadow: 0 8px 20px rgba(59, 94, 255, 0.4);
        color: #f4f6ff;
        font-size: 13px;
        font-weight: 600;
        z-index: 4;
        opacity: 0;
        transform-origin: center;
      }

      #cal-panel {
        left: 550px;
        width: 220px;
        height: 260px;
        transform-origin: center;
        opacity: 0;
      }
      .cal-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 18px 20px 0;
      }
      .cal-label {
        font-size: 13px;
        font-weight: 500;
        color: rgba(210, 216, 255, 0.65);
      }
      .cal-grid {
        margin: 18px 20px 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .cal-cell {
        aspect-ratio: 1;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .cal-slot {
        position: relative;
        background: rgba(82, 117, 255, 0.12);
        border: 1px solid rgba(174, 187, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #cal-check {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #aebbff;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }
    </style>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const connectorPath = document.getElementById("connector-path");
        const connLen = connectorPath.getTotalLength();
        gsap.set(connectorPath, { strokeDasharray: connLen, strokeDashoffset: connLen });
        gsap.set("#chat-panel", { xPercent: -50, yPercent: -50, scale: 0 });
        gsap.set("#cal-panel", { xPercent: -50, yPercent: -50, scale: 0 });
        gsap.set("#fly-card", { xPercent: -50, yPercent: -50, scale: 0, x: 0, y: 0 });
        gsap.set("#cal-check", { scale: 0 });

        // ---- Panels arrive ----
        tl.to("#chat-panel", { xPercent: -50, yPercent: -50, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
        tl.to("#cal-panel", { xPercent: -50, yPercent: -50, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.12);
        tl.fromTo("#chat-sheen", { x: 0, opacity: 0 }, { x: 420, opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0.15);
        tl.to("#chat-sheen", { opacity: 0, duration: 0.2 }, 0.65);
        tl.fromTo("#cal-sheen", { x: 0, opacity: 0 }, { x: 310, opacity: 1, duration: 0.5, ease: "power2.inOut" }, 0.27);
        tl.to("#cal-sheen", { opacity: 0, duration: 0.2 }, 0.77);

        tl.addLabel("panelsSettled", 0.55);

        // ---- Incoming message bubble pops in ----
        tl.fromTo("#bubble-in", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, "panelsSettled+=0.1");

        // ---- Typing indicator: brief, then answer lands instantly (no long wait) ----
        tl.to("#typing-row", { opacity: 1, duration: 0.15 }, "panelsSettled+=0.55");
        const dots = document.querySelectorAll(".typing-dot");
        const dotPhase = { p: 0 };
        tl.to(
          dotPhase,
          {
            p: Math.PI * 2 * 1.4,
            duration: 0.55,
            ease: "none",
            onUpdate: () => {
              dots.forEach((d, i) => {
                const s = 1 + Math.max(0, Math.sin(dotPhase.p - i * 0.6)) * 0.5;
                d.style.transform = `scale(${s})`;
              });
            },
          },
          "panelsSettled+=0.55"
        );
        tl.to("#typing-row", { opacity: 0, duration: 0.15 }, "panelsSettled+=1.05");
        tl.fromTo("#bubble-out", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, "panelsSettled+=1.1");

        tl.addLabel("answered", "panelsSettled+=1.55");

        // ---- Connector draws + the appointment card flies from chat to the calendar slot ----
        tl.to(connectorPath, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, "answered");
        tl.fromTo(
          "#fly-card",
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0, opacity: 0 },
          { xPercent: -50, yPercent: -50, scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
          "answered+=0.1"
        );
        tl.to("#fly-card", { xPercent: -50, yPercent: -50, x: 200, y: -52, duration: 0.45, ease: "power2.inOut", overwrite: "auto" }, "answered+=0.4");
        tl.to("#fly-card", { scale: 0, opacity: 0, duration: 0.2, ease: "power1.in" }, "answered+=0.8");

        // ---- Calendar slot receives it: highlight + check pop ----
        tl.to("#cal-slot", { boxShadow: "0 0 0 2px rgba(174,187,255,0.55), 0 0 18px 2px rgba(82,117,255,0.5)", duration: 0.25 }, "answered+=0.78");
        tl.fromTo("#cal-check", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, "answered+=0.85");

        tl.addLabel("hold", "answered+=1.3");

        // ---- Fade everything out for a seamless loop back to the empty frame ----
        tl.to(
          ["#chat-panel", "#cal-panel", "#fly-card", connectorPath],
          { opacity: 0, duration: 0.4, ease: "power1.in" },
          "hold"
        );
        tl.set("#chat-panel", { xPercent: -50, yPercent: -50, scale: 0 }, "hold+=0.4");
        tl.set("#cal-panel", { xPercent: -50, yPercent: -50, scale: 0 }, "hold+=0.4");
        tl.set("#fly-card", { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0 }, "hold+=0.4");
        tl.set(["#bubble-in", "#bubble-out", "#typing-row"], { opacity: 0, scale: 0 }, "hold+=0.4");
        tl.set(connectorPath, { strokeDashoffset: connLen }, "hold+=0.4");
        tl.set("#cal-check", { opacity: 0, scale: 0 }, "hold+=0.4");
        tl.set("#cal-slot", { boxShadow: "none" }, "hold+=0.4");

        tl.addLabel("loopEnd", "hold+=0.6");

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
